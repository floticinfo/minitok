# minitok Client CI Pipeline
# Runs tests and security scan on push to master

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ── Job 1: Test ──
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22.19, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix extension ci --ignore-scripts
          npm run package:extension

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Check documentation consistency
        run: npm run docs:check

      - name: Validate package manifest
        run: npm pack --dry-run --json

      - name: Run portable verification gate
        run: node VERIFY_CMD.mjs

      - name: Run packed install smoke test
        run: npm run test:packed-install

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Validate release YAML
        run: node -e "const fs=require('fs'); const yaml=require('js-yaml'); yaml.load(fs.readFileSync('.github/workflows/ci.yml','utf8'));"
      - name: Run packed install smoke test
        run: npm run test:packed-install
      - name: Verify release provenance
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run release:verify


  # ── Job 2: Security scan ──
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Check tracked and added files for secrets
        run: node scripts/secret-scan.mjs

      - name: Check for project data in evolution upload
        run: node -e "const fs=require('fs'); const c=fs.readFileSync('src/evolution/upload.js','utf8'); if (/source_code|file_path|prompt/.test(c) && !c.includes('sanitizeEvolutionOutcome')) process.exit(1);"
