name: Publish extension to VS Code Marketplace

# Publishes minitok-extension VSIX to the Visual Studio Marketplace.
#
# Triggers:
#   - workflow_dispatch: manual publish for a given extension version
#
# Publishing auth:
#   - vsce publish --oidc (trusted publishing) when the publisher has an
#     OIDC trusted publishing policy configured; falls back to VSCE_PAT
#     secret if present.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Extension version to publish (must match extension/package.json)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-marketplace
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify extension version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          test "${INPUT_VERSION}" = "$(node -p "require('./extension/package.json').version")"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        # Root deps are required: extension tests spawn bin/minitok.js,
        # which requires commander from the root node_modules.
        run: |
          npm ci
          npm --prefix extension ci

      - name: Compile extension
        run: npm --prefix extension run compile

      # Note: mcp-ui tests spawn live MCP processes which hang in CI
      # (cancelled by parent timeout). The full suite including mcp-ui and
      # host integration runs locally via `npm run test:extension` and gates
      # the release. CI runs the non-process-spawning subset.
      - name: Run extension unit tests (CI-safe subset)
        working-directory: extension
        run: >-
          node --test test/process-contract.test.js test/mcp-config.test.js
          test/version.test.js test/spawn.test.js test/auth-ui.test.js
          test/device-auth.test.js test/activate.test.js test/truncate.test.js
          test/theme-contrast.test.js test/boundary-audit.test.js
          test/entitlement.test.js test/task-context-ui.test.js
          test/progress-approval-ui.test.js test/approval-trust.test.js

      - name: Package VSIX
        run: npm --prefix extension run package

      - name: Verify VSIX metadata
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          ls -la extension/*.vsix
          test -f "extension/minitok-extension-${INPUT_VERSION}.vsix"

      - name: Publish to Marketplace
        working-directory: extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "$VSCE_PAT" ]; then
            npx @vscode/vsce publish --pat "$VSCE_PAT"
          else
            npx @vscode/vsce publish --oidc
          fi