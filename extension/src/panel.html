<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src {{cspSource}}; style-src {{cspSource}} 'unsafe-inline'; script-src 'nonce-{{nonce}}'"/><style>
/* minitok brand palette -- mirrors src/core/palette.js, which is the single
   source of truth; palette.test.js asserts this block stays identical. This
   panel only paints the brand mark, so it needs primary/on-primary plus the
   deepest fill and the palest tint for the mark's pressed state; the remaining
   members are declared to keep the mirror complete, and every surface and
   semantic state stays on the editor's own --vscode-* theme. The derived
   --mt-brand-surface-accent is declared too, even though this panel only paints
   the mark, so both webviews can be diffed against palette.js as one block. */
:root{--mt-brand-primary:#013DCF;--mt-brand-primary-hover:#012CA8;--mt-brand-deep-navy:#03045E;--mt-brand-secondary:#0077B6;--mt-brand-cyan:#00B4D8;--mt-brand-sky:#90E0EF;--mt-brand-pale:#CAF0F8;--mt-brand-on-primary:#FFFFFF;--mt-brand-surface-accent:var(--mt-brand-primary)}body.vscode-dark{--mt-brand-surface-accent:var(--mt-brand-cyan)}body.vscode-high-contrast{--mt-brand-surface-accent:var(--mt-brand-sky)}
body{font-family:var(--vscode-font-family);padding:16px;margin:0;box-sizing:border-box;max-width:100%;overflow:auto}body.vscode-reduce-motion *{transition:none!important;animation:none!important}.auth-gate{position:fixed;inset:0;z-index:10;padding:24px;background:var(--vscode-sideBar-background);display:flex;align-items:center;justify-content:center}[hidden]{display:none!important}.auth-card{max-width:320px;width:100%;text-align:center}.auth-card button{width:100%;margin:4px 0}.auth-card p{color:var(--vscode-descriptionForeground)}.brand{display:flex;align-items:center;gap:8px;font-weight:600}.brand-logo{display:block;width:24px;height:24px;flex:0 0 auto}.row{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}textarea{display:block;width:100%;max-width:100%;min-height:100px;box-sizing:border-box;resize:vertical}button{padding:6px 12px;min-height:30px}button:hover:not(:disabled){background:var(--vscode-button-hoverBackground)}button:disabled{opacity:.5;cursor:default}button:focus-visible,textarea:focus-visible,input:focus-visible{outline:1px solid var(--vscode-focusBorder);outline-offset:2px}#task-help{color:var(--vscode-descriptionForeground);font-size:11px;margin-top:2px}.status{white-space:pre-wrap;background:var(--vscode-textCodeBlock-background);padding:10px}.ok{color:var(--vscode-testing-iconPassed)}.error{color:var(--vscode-testing-iconFailed)}.toast-container{position:fixed;top:12px;right:12px;z-index:1000;display:flex;flex-direction:column;gap:8px;max-width:320px;pointer-events:none}.toast{pointer-events:auto;padding:10px 12px;border-radius:4px;background:var(--vscode-notifications-background);color:var(--vscode-notifications-foreground);border:1px solid var(--vscode-notifications-border);box-shadow:0 2px 8px var(--vscode-widget-shadow);font-size:var(--vscode-font-size);line-height:1.4;white-space:pre-wrap;word-break:break-word;animation:mt-toast-in .16s ease-out}.toast.info{border-left:3px solid var(--vscode-testing-iconPassed)}.toast.error{border-left:3px solid var(--vscode-testing-iconFailed)}@keyframes mt-toast-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}body.vscode-reduce-motion .toast{animation:none}</style></head>
<body><div id="toastContainer" class="toast-container" aria-live="polite"></div><div id="mcpStatus" class="badge offline" title="MCP status" aria-live="polite" style="position:fixed;top:12px;left:12px;z-index:1000;padding:4px 8px;border-radius:4px;font-size:11px;background:var(--vscode-badge-background);color:var(--vscode-badge-foreground);">MCP: offline</div><section id="authGate" class="auth-gate"><div class="auth-card"><h1>Sign in to minitok</h1><p id="authPrompt" role="status" aria-live="polite">Checking your minitok session...</p><p id="authError" role="alert" aria-live="assertive"></p><div id="loginForm" hidden><label for="loginEmail">Email</label><input id="loginEmail" type="email" placeholder="Email" autocomplete="username" aria-describedby="authError"><label for="loginPassword">Password</label><input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password" aria-describedby="authError"><button id="loginButton" type="button">Sign in</button><button id="browserLoginButton" type="button">Sign in with browser</button><button id="cancelLoginButton" type="button" hidden>Cancel sign-in</button></div></div></section><main id="app" hidden><div class="brand" role="heading" aria-level="1"><img class="brand-logo" src="{{brandUri}}" alt="" aria-hidden="true">minitok</div><button id="logoutButton" type="button" hidden>Sign out</button><div class="row"><button id="activateButton" type="button" hidden>Activate plan</button></div><label for="task">Task description</label><textarea id="task" placeholder="Describe the repository task minitok should run."></textarea><div class="row"><button id="run" type="button" disabled>Run</button><button id="dry" type="button" disabled>Dry run</button><button id="status" type="button" disabled>Status</button></div><div id="state" class="status" role="status" aria-live="polite" aria-atomic="true">Ready</div><script nonce="{{nonce}}">const vscode=acquireVsCodeApi();const state=document.getElementById('state');const task=document.getElementById('task');function showToast(text,kind){if(!text)return;const container=document.getElementById('toastContainer');if(!container)return;const t=document.createElement('div');t.className='toast '+(kind==='error'?'error':'info');t.setAttribute('role',kind==='error'?'alert':'status');t.textContent=text;container.appendChild(t);setTimeout(()=>{t.remove()},6000);t.addEventListener('click',()=>t.remove())}function send(command){state.textContent='Running...';state.className='status';vscode.postMessage({command,task:task.value})}document.getElementById('run').onclick=()=>send('run');document.getElementById('dry').onclick=()=>send('dry-run');document.getElementById('status').onclick=()=>send('status');window.addEventListener('message',e=>{const m=e.data;if(m.type==='mcp'){const b=document.getElementById('mcpStatus');b.textContent='MCP: '+(m.ok?'online':'offline');b.className='badge '+(m.ok?'online':'offline');b.title='MCP '+(m.ok?'online':'offline')+(m.text?': '+m.text:'');b.setAttribute('aria-label','MCP '+(m.ok?'online':'offline')+(m.text?'. '+m.text:''));return}if(m.type!=='result')return;state.textContent=m.text;state.className='status '+(m.ok?'ok':m.ok===false?'error':'');if(m.ok===false)showToast('Run failed. See status below.','error');if(m.ok===false||m.ok===true)task.focus()});vscode.postMessage({command:'mcp-status'});</script></main><script nonce="{{nonce}}">const authVscode=vscode;let authResolved=false;const AUTH_WATCHDOG_MS=5000;const authGate=document.getElementById('authGate');const app=document.getElementById('app');const authError=document.getElementById('authError');const authPrompt=document.getElementById('authPrompt');const loginForm=document.getElementById('loginForm');const logoutButton=document.getElementById('logoutButton');const cancelLoginButton=document.getElementById('cancelLoginButton');cancelLoginButton.onclick=()=>authVscode.postMessage({command:'cancel-login'});window.addEventListener('message',event=>{const m=event.data;if(m.type==='auth-state'){authResolved=true;const authenticated=m.authenticated===true;const entitled=m.entitled===true;const state=m.state|| (authenticated?'authenticated':'signed-out');const checking=state==='checking';authGate.hidden=authenticated;app.hidden=!authenticated;logoutButton.hidden=!authenticated;loginForm.hidden=checking||authenticated;cancelLoginButton.hidden=!checking;document.getElementById('loginButton').disabled=checking;document.getElementById('browserLoginButton').disabled=checking;authPrompt.textContent=checking?(m.text||'Checking your minitok session...'):authenticated?(entitled?(m.text||'Signed in with your minitok account.'):'Signed in, but this account is not entitled to run minitok.'):'';const authMsg=authenticated&&!entitled?(m.text||'Activate or manage your plan to continue.'):(!authenticated&&state!=='checking'?(m.text||''): '');authError.textContent='';if(authMsg)showToast(authMsg,'error');document.getElementById('run').disabled=!entitled;document.getElementById('dry').disabled=!entitled;document.getElementById('status').disabled=!entitled;document.getElementById('activateButton').hidden=!authenticated||entitled;}});document.getElementById('activateButton').onclick=()=>authVscode.postMessage({command:'activate'});document.getElementById('browserLoginButton').onclick=()=>authVscode.postMessage({command:'device-login'});document.getElementById('loginButton').onclick=e=>{const adminRoute=e.ctrlKey&&e.shiftKey;showToast(adminRoute?'Signing in as admin...':'Signing in...','info');authVscode.postMessage({command:adminRoute?'admin-login':'customer-login',email:document.getElementById('loginEmail').value,password:document.getElementById('loginPassword').value})};logoutButton.onclick=()=>authVscode.postMessage({command:'device-logout'});document.getElementById('loginPassword').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('loginButton').click()});authVscode.postMessage({command:'auth-status'});setTimeout(()=>{if(authResolved)return;authGate.hidden=false;app.hidden=true;logoutButton.hidden=true;loginForm.hidden=false;cancelLoginButton.hidden=true;document.getElementById('loginButton').disabled=false;document.getElementById('browserLoginButton').disabled=false;authPrompt.textContent='Sign-in did not answer. Try again below.';authError.textContent='';showToast('Could not confirm your minitok session.','error');},AUTH_WATCHDOG_MS);</script></body>
</html>
