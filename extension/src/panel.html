<!doctype html>
<html>
<head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline'; script-src 'nonce-{{nonce}}'"/><style>
/* minitok brand palette -- mirrors src/core/palette.js, which is the single
   source of truth; palette.test.js asserts this block stays identical. This
   panel only paints the brand mark, so it needs primary/on-primary plus the
   deepest fill and the palest tint for the mark's pressed state; the remaining
   members are declared to keep the mirror complete, and every surface and
   semantic state stays on the editor's own --vscode-* theme. The derived
   --mt-brand-surface-accent is declared too, even though this panel only paints
   the mark, so both webviews can be diffed against palette.js as one block. */
:root{--mt-brand-primary:#013DCF;--mt-brand-primary-hover:#012CA8;--mt-brand-deep-navy:#03045E;--mt-brand-secondary:#0077B6;--mt-brand-cyan:#00B4D8;--mt-brand-sky:#90E0EF;--mt-brand-pale:#CAF0F8;--mt-brand-on-primary:#FFFFFF;--mt-brand-surface-accent:var(--mt-brand-primary)}body.vscode-dark{--mt-brand-surface-accent:var(--mt-brand-cyan)}body.vscode-high-contrast{--mt-brand-surface-accent:var(--mt-brand-sky)}
body{font-family:var(--vscode-font-family);padding:16px}.auth-gate{position:fixed;inset:0;z-index:10;padding:24px;background:var(--vscode-sideBar-background);display:flex;align-items:center;justify-content:center}.auth-card{max-width:320px;width:100%;text-align:center}.auth-card button{width:100%;margin:4px 0}.auth-card p{color:var(--vscode-descriptionForeground)}.brand{display:flex;align-items:center;gap:8px;font-weight:600}.brand:before{content:'m';display:grid;place-items:center;width:24px;height:24px;border-radius:5px;background:var(--mt-brand-primary);color:var(--mt-brand-on-primary);font-family:system-ui,-apple-system,sans-serif;font-weight:800;font-size:15px;line-height:1}.brand:before:active{background:var(--mt-brand-primary-hover)}.row{display:flex;gap:8px;margin:8px 0}textarea{width:100%;min-height:100px}button{padding:6px 12px}.status{white-space:pre-wrap;background:var(--vscode-textCodeBlock-background);padding:10px}.ok{color:var(--vscode-testing-iconPassed)}.error{color:var(--vscode-testing-iconFailed)}</style></head>
<body><section id="authGate" class="auth-gate"><div class="auth-card"><h1>Sign in to minitok</h1><p id="authPrompt" role="status" aria-live="polite">Checking your minitok session...</p><p id="authError" role="alert" aria-live="assertive"></p><div id="loginForm" hidden><button id="browserLoginButton" type="button">Sign in with browser</button></div></div></section><main id="app" hidden><div class="brand" role="heading" aria-level="1">minitok</div><button id="logoutButton" type="button" hidden>Sign out</button><div class="row"><button id="activateButton" type="button" hidden>Activate plan</button><button id="manageButton" type="button" hidden>Manage plan</button></div><label for="task">Task description</label><textarea id="task" aria-describedby="task-help" placeholder="Describe the task"></textarea><div id="task-help">Describe the repository task minitok should run.</div><div class="row"><button id="run" type="button" disabled>Run</button><button id="dry" type="button" disabled>Dry run</button><button id="status" type="button" disabled>Status</button></div><div id="state" class="status" role="status" aria-live="polite" aria-atomic="true">Ready</div><script nonce="{{nonce}}">const vscode=acquireVsCodeApi();const state=document.getElementById('state');const task=document.getElementById('task');function send(command){state.textContent='Running...';state.className='status';vscode.postMessage({command,task:task.value})}document.getElementById('run').onclick=()=>send('run');document.getElementById('dry').onclick=()=>send('dry-run');document.getElementById('status').onclick=()=>send('status');window.addEventListener('message',e=>{const m=e.data;state.textContent=m.text;state.className='status '+(m.ok?'ok':m.ok===false?'error':'');if(m.ok===false||m.ok===true)task.focus()})</script></main><script nonce="{{nonce}}">const authVscode=acquireVsCodeApi();const authGate=document.getElementById('authGate');const app=document.getElementById('app');const authError=document.getElementById('authError');const authPrompt=document.getElementById('authPrompt');const loginForm=document.getElementById('loginForm');const logoutButton=document.getElementById('logoutButton');window.addEventListener('message',event=>{const m=event.data;if(m.type==='auth-state'){const authenticated=m.authenticated===true;const entitled=m.entitled===true;const state=m.state|| (authenticated?'authenticated':'signed-out');const checking=state==='checking';authGate.hidden=authenticated;app.hidden=!authenticated;logoutButton.hidden=!authenticated;loginForm.hidden=checking||authenticated;authPrompt.textContent=checking?'Checking your minitok session...':authenticated?(entitled?`Signed in with ${m.text||'your minitok account.'}`:'Signed in, but this account is not entitled to run minitok.'):'Sign in to continue';authError.textContent=authenticated&&!entitled?(m.text||'Activate or manage your plan to continue.'):(!authenticated&&state!=='checking'?(m.text||''): '');document.getElementById('run').disabled=!entitled;document.getElementById('dry').disabled=!entitled;document.getElementById('status').disabled=!entitled;document.getElementById('activateButton').hidden=!authenticated||entitled;document.getElementById('manageButton').hidden=!authenticated;}});document.getElementById('activateButton').onclick=()=>authVscode.postMessage({command:'activate'});document.getElementById('manageButton').onclick=()=>authVscode.postMessage({command:'manage-plan'});document.getElementById('browserLoginButton').onclick=()=>authVscode.postMessage({command:'device-login'});logoutButton.onclick=()=>authVscode.postMessage({command:'device-logout'});authVscode.postMessage({command:'auth-status'});</script></body>
</html>
