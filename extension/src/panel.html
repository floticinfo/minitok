<!doctype html>
<html>
<head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline'; script-src 'nonce-{{nonce}}'"/><style>
/* minitok brand palette -- mirrors src/core/palette.js, which is the single
   source of truth; palette.test.js asserts this block stays identical. This
   panel only paints the brand mark, so it needs primary/on-primary plus the
   deepest fill and the palest tint for the mark's pressed state; the remaining
   members are declared to keep the mirror complete, and every surface and
   semantic state stays on the editor's own --vscode-* theme. The derived
   --mt-brand-surface-accent is declared too, even though this panel only paints
   the mark, so both webviews can be diffed against palette.js as one block. */
:root{--mt-brand-primary:#013DCF;--mt-brand-primary-hover:#012CA8;--mt-brand-deep-navy:#03045E;--mt-brand-secondary:#0077B6;--mt-brand-cyan:#00B4D8;--mt-brand-sky:#90E0EF;--mt-brand-pale:#CAF0F8;--mt-brand-on-primary:#FFFFFF;--mt-brand-surface-accent:var(--mt-brand-primary)}body.vscode-dark{--mt-brand-surface-accent:var(--mt-brand-cyan)}body.vscode-high-contrast{--mt-brand-surface-accent:var(--mt-brand-sky)}
body{font-family:var(--vscode-font-family);padding:16px}.brand{display:flex;align-items:center;gap:8px;font-weight:600}.brand:before{content:'m';display:grid;place-items:center;width:24px;height:24px;border-radius:5px;background:var(--mt-brand-primary);color:var(--mt-brand-on-primary);font-family:system-ui,-apple-system,sans-serif;font-weight:800;font-size:15px;line-height:1}.brand:before:active{background:var(--mt-brand-primary-hover)}.row{display:flex;gap:8px;margin:8px 0}textarea{width:100%;min-height:100px}button{padding:6px 12px}.status{white-space:pre-wrap;background:var(--vscode-textCodeBlock-background);padding:10px}.ok{color:var(--vscode-testing-iconPassed)}.error{color:var(--vscode-testing-iconFailed)}</style></head>
<body><div class="brand" role="heading" aria-level="1">minitok</div><label for="task">Task description</label><textarea id="task" aria-describedby="task-help" placeholder="Describe the task"></textarea><div id="task-help">Describe the repository task minitok should run.</div><div class="row"><button id="run" type="button">Run</button><button id="dry" type="button">Dry run</button><button id="status" type="button">Status</button></div><div id="state" class="status" role="status" aria-live="polite" aria-atomic="true">Ready</div><script nonce="{{nonce}}">const vscode=acquireVsCodeApi();const state=document.getElementById('state');const task=document.getElementById('task');function send(command){state.textContent='Running...';state.className='status';vscode.postMessage({command,task:task.value})}document.getElementById('run').onclick=()=>send('run');document.getElementById('dry').onclick=()=>send('dry-run');document.getElementById('status').onclick=()=>send('status');window.addEventListener('message',e=>{const m=e.data;state.textContent=m.text;state.className='status '+(m.ok?'ok':m.ok===false?'error':'');if(m.ok===false||m.ok===true)task.focus()})</script></body>
</html>
