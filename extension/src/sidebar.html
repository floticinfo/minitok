<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src {{cspSource}}; style-src {{cspSource}} 'unsafe-inline'; script-src 'nonce-{{nonce}}'">
    <style>
      /* minitok brand palette -- mirrors src/core/palette.js, which is the single
      source of truth; palette.test.js asserts this block stays identical.
      primary       #013DCF  brand mark, active/selected product states
      primary-hover #012CA8  pressed or hovered state of a primary fill
      deep-navy     #03045E  deepest fill
      secondary     #0077B6  secondary accents (legible on light and dark)
      cyan          #00B4D8  accent on dark surfaces
      sky           #90E0EF  light tint and hairline borders on dark surfaces
      pale          #CAF0F8  lightest tint
      on-primary    #FFFFFF  glyph or text on a primary fill
      Every property is declared, not only the ones this file happens to paint
      with, so the mirror can be diffed against palette.js at a glance. Surfaces
      stay on the editor's own theme (--vscode-*) and so do the semantic states --
      .online/.offline/.error/.success/.approval, the danger/success button fills
      and the focus ring -- because a success or failure status must not be
      re-tinted to a brand hue and a focus ring must follow the user's
      accessibility theme. What minitok owns is branded: the mark, the selected
      mode toggle, the active step and the live status.
      --mt-brand-surface-accent is the one derived property: the palette member to
      paint *on the host surface*. VS Code stamps vscode-dark/vscode-light on the
      body, and a dark hue is invisible on a dark surface just as a light one is
      invisible on a light surface, so it switches with the theme. */
      :root {
        color-scheme:light dark;
        --mt-brand-primary:#013DCF;
        --mt-brand-primary-hover:#012CA8;
        --mt-brand-deep-navy:#03045E;
        --mt-brand-secondary:#0077B6;
        --mt-brand-cyan:#00B4D8;
        --mt-brand-sky:#90E0EF;
        --mt-brand-pale:#CAF0F8;
        --mt-brand-on-primary:#FFFFFF;
        --mt-brand-surface-accent:var(--mt-brand-primary)
      }
      body.vscode-dark {
        --mt-brand-surface-accent:var(--mt-brand-cyan)
      }
      body.vscode-high-contrast {
        --mt-brand-surface-accent:var(--mt-brand-sky)
      }
      body.vscode-reduce-motion *,body.vscode-reduce-motion *::before,body.vscode-reduce-motion *::after {
        transition:none!important;
        animation:none!important
      }
      body.vscode-using-screen-reader .visual-only {
        display:none
      }
      * {
        box-sizing:border-box
      }
      /* Every auth state switches surfaces by toggling the hidden attribute, but
         an author `display` value outranks the user-agent [hidden] rule: .auth-gate
         and #loading are display:flex, so a successful sign-in set hidden=true and
         still left the sign-in card painted over the app (position:fixed, inset:0,
         z-index:10). This one rule makes the attribute authoritative again. */
      [hidden] {
        display:none!important
      }
      .auth-gate {
        position:fixed;
        inset:0;
        z-index:10;
        padding:24px;
        background:var(--vscode-sideBar-background);
        display:flex;
        align-items:center;
        justify-content:center
      }
      .auth-card {
        max-width:320px;
        width:100%;
        text-align:center
      }
      .auth-card h1 {
        font-size:20px;
        margin:0 0 8px
      }
      .auth-card p {
        color:var(--vscode-descriptionForeground)
      }
      .auth-card input {
        width:100%;
        margin:6px 0;
        padding:6px
      }
      .auth-card button {
        width:100%;
        margin:4px 0
      }
      .auth-error {
        color:var(--vscode-testing-iconFailed);
        min-height:20px
      }
      .toast-container {
        position:fixed;
        top:12px;
        right:12px;
        z-index:1000;
        display:flex;
        flex-direction:column;
        gap:8px;
        max-width:320px;
        pointer-events:none
      }
      .toast {
        pointer-events:auto;
        padding:10px 12px;
        border-radius:4px;
        background:var(--vscode-notifications-background);
        color:var(--vscode-notifications-foreground);
        border:1px solid var(--vscode-notifications-border);
        box-shadow:0 2px 8px var(--vscode-widget-shadow);
        font-size:var(--vscode-font-size);
        line-height:1.4;
        white-space:pre-wrap;
        word-break:break-word;
        animation:mt-toast-in .16s ease-out
      }
      .toast.info {
        border-left:3px solid var(--vscode-testing-iconPassed)
      }
      .toast.error {
        border-left:3px solid var(--vscode-testing-iconFailed)
      }
      @keyframes mt-toast-in {
        from{opacity:0;transform:translateY(-6px)}
        to{opacity:1;transform:none}
      }
      body.vscode-reduce-motion .toast {
        animation:none
      }
      * {
        box-sizing:border-box
      }
      body {
        font-family:var(--vscode-font-family);
        font-size:var(--vscode-font-size);
        line-height:1.45;
        color:var(--vscode-foreground);
        background:var(--vscode-sideBar-background);
        margin:0;
        padding:14px
      }
      .header {
        display:flex;
        align-items:center;
        justify-content:space-between;
        margin:2px 0 16px
      }
      .brand {
        display:flex;
        align-items:center;
        gap:8px;
        font-weight:600;
        letter-spacing:.2px
      }
      /* The brand glyph is the same Harlekin 'm' path the Activity Bar icon
         uses (media/minitok-activitybar.svg), loaded through asWebviewUri so
         the glyph is pixel-identical everywhere the mark appears. */
      .brand-logo {
        display:block;
        width:24px;
        height:24px;
        flex:0 0 auto;
        border-radius:5px;
        background:var(--mt-brand-primary);
        color:var(--mt-brand-on-primary)
      }
      .header-actions {
        display:flex;
        align-items:center;
        gap:6px
      }
      .icon-button {
        flex:0 0 auto;
        min-height:24px;
        padding:2px 6px;
        background:transparent;
        color:var(--vscode-descriptionForeground);
        border:0;
        font-size:14px
      }
      .badge {
        font-size:10px;
        color:var(--vscode-descriptionForeground);
        padding:3px 7px;
        border:1px solid var(--vscode-sideBar-border);
        border-radius:10px
      }
      .online {
        color:var(--vscode-testing-iconPassed)
      }
      .offline,.error {
        color:var(--vscode-testing-iconFailed)
      }
      .card {
        border:1px solid var(--vscode-sideBar-border);
        border-radius:8px;
        background:var(--vscode-textCodeBlock-background);
        padding:10px;
        margin-bottom:10px
      }
      .label {
        font-size:10px;
        letter-spacing:.08em;
        text-transform:uppercase;
        color:var(--vscode-descriptionForeground);
        margin-bottom:6px
      }
      .role-heading {
        margin-top:20px
      }
      label {
        display:block;
        font-size:11px;
        color:var(--vscode-descriptionForeground);
        margin:8px 0
      }
      .version-row {
        display:flex;
        justify-content:space-between;
        align-items:center;
        margin-top:10px;
        color:var(--vscode-descriptionForeground);
        font-size:10px
      }
      .version-row button {
        flex:0 0 auto;
        min-height:24px;
        font-size:10px
      }
      .toggle-actions {
        display:flex;
        gap:6px
      }
      .toggle-choice {
        background:var(--vscode-button-secondaryBackground);
        color:var(--vscode-button-secondaryForeground)
      }
      .toggle-choice.selected {
        background:var(--mt-brand-primary);
        color:var(--mt-brand-on-primary)
      }
      .toggle-choice.selected:active {
        background:var(--mt-brand-primary-hover)
      }
      .task-header {
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:8px
      }
      .task-status {
        font-size:10px;
        font-weight:600;
        color:var(--vscode-descriptionForeground)
      }
      .task-status.running {
        color:var(--mt-brand-surface-accent,var(--vscode-charts-blue));
        animation:status-breathe 1.8s ease-in-out infinite
      }
      .task-status.success {
        color:var(--vscode-testing-iconPassed)
      }
      .task-status.error {
        color:var(--vscode-testing-iconFailed)
      }
      .steps {
        display:flex;
        gap:6px;
        margin-top:10px
      }
      .step {
        flex:1;
        padding:5px 4px;
        border:1px solid var(--vscode-sideBar-border);
        border-radius:4px;
        text-align:center;
        color:var(--vscode-descriptionForeground);
        font-size:10px
      }
      .step.active {
        border-color:var(--mt-brand-surface-accent,var(--vscode-button-background));
        background:var(--vscode-button-secondaryBackground);
        color:var(--vscode-foreground);
        animation:status-breathe 1.8s ease-in-out infinite
      }
      .step.completed {
        border-color:var(--vscode-testing-iconPassed);
        color:var(--vscode-testing-iconPassed)
      }
      .step.failed {
        border-color:var(--vscode-testing-iconFailed);
        color:var(--vscode-testing-iconFailed)
      }
      @keyframes status-breathe {
        0%,100% {
          opacity:.55
        }
        50% {
          opacity:1
        }
      }
      #loading {
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        gap:12px;
        min-height:180px;
        padding:24px;
        color:var(--vscode-foreground)
      }
      #loading p {
        margin:0;
        font-size:12px;
        color:var(--vscode-descriptionForeground)
      }
      .spinner {
        width:22px;
        height:22px;
        border:2px solid var(--vscode-descriptionForeground);
        border-top-color:var(--vscode-progressBar-background);
        border-radius:50%;
        animation:loading-spin 0.9s linear infinite
      }
      @keyframes loading-spin {
        to {
          transform:rotate(360deg)
        }
      }
      @media (prefers-reduced-motion:reduce) {
        .spinner {
          animation:none
        }
      }
      .setting {
        display:block;
        width:100%;
        margin-top:4px;
        padding:6px;
        border:1px solid var(--vscode-input-border);
        border-radius:4px;
        background:var(--vscode-input-background);
        color:var(--vscode-input-foreground);
        font:inherit
      }
      .check {
        display:flex;
        gap:6px;
        align-items:center
      }
      .task {
        display:block;
        width:100%;
        min-height:88px;
        resize:vertical;
        padding:9px;
        border:1px solid var(--vscode-input-border);
        border-radius:5px;
        background:var(--vscode-input-background);
        color:var(--vscode-input-foreground);
        font:inherit
      }
      .task:focus {
        outline:1px solid var(--vscode-focusBorder);
        outline-offset:-1px
      }
      .attachments {
        display:flex;
        gap:5px;
        margin-top:6px
      }
      .attachments button {
        font-size:11px;
        min-height:26px
      }
      .actions {
        display:flex;
        gap:6px;
        margin-top:8px
      }
      button {
        flex:1;
        min-height:30px;
        padding:6px 8px;
        border:1px solid var(--vscode-button-border);
        border-radius:5px;
        background:var(--vscode-button-background);
        color:var(--vscode-button-foreground);
        cursor:pointer;
        font:inherit;
        font-size:12px
      }
      button.secondary {
        background:var(--vscode-button-secondaryBackground);
        color:var(--vscode-button-secondaryForeground)
      }
      button.success {
        background:var(--vscode-testing-iconPassed);
        color:var(--vscode-button-foreground)
      }
      button.danger {
        background:var(--vscode-testing-iconFailed);
        color:var(--vscode-button-foreground)
      }
      button:hover:not(:disabled) {
        background:var(--vscode-button-hoverBackground)
      }
      button.secondary:hover:not(:disabled) {
        background:var(--vscode-button-secondaryHoverBackground)
      }
      button:focus-visible {
        outline:1px solid var(--vscode-focusBorder);
        outline-offset:2px
      }
      button:disabled {
        opacity:.5;
        cursor:default
      }
      input:focus-visible,select:focus-visible,textarea:focus-visible {
        outline:1px solid var(--vscode-focusBorder);
        outline-offset:1px
      }
      .approval {
        border-color:var(--vscode-testing-iconPassed)
      }
      .status-row {
        display:flex;
        justify-content:space-between;
        gap:8px;
        align-items:center
      }
      .status {
        font-weight:600
      }
      .summary {
        font-size:11px;
        color:var(--vscode-descriptionForeground);
        text-align:right
      }
      .steps {
        display:grid;
        grid-template-columns:repeat(4,1fr);
        gap:4px;
        margin-top:10px
      }
      .step {
        font-size:10px;
        text-align:center;
        color:var(--vscode-descriptionForeground);
        padding-top:18px;
        position:relative
      }
      .step:before {
        content:'';
        position:absolute;
        top:4px;
        left:50%;
        width:8px;
        height:8px;
        transform:translateX(-50%);
        border-radius:50%;
        background:var(--vscode-descriptionForeground)
      }
      .step.active {
        color:var(--vscode-foreground)
      }
      .step.active:before {
        background:var(--mt-brand-surface-accent,var(--vscode-textLink-foreground));
        box-shadow:0 0 0 3px color-mix(in srgb,var(--mt-brand-surface-accent,var(--vscode-textLink-foreground)) 30%,transparent)
      }
      .activity {
        min-height:70px;
        max-height:180px;
        overflow:auto;
        white-space:pre-wrap
      }
      .empty {
        font-size:12px;
        color:var(--vscode-descriptionForeground)
      }
      .message {
        padding:7px 8px;
        margin:4px 0;
        border-left:2px solid var(--mt-brand-secondary);
        background:var(--vscode-textBlockQuote-background);
        white-space:pre-wrap;
        overflow-wrap:anywhere
      }
      .session-item small {
        display:block;
        color:var(--vscode-descriptionForeground);
        font-size:9px;
        margin-top:2px
      }
      .session-item {
        display:block;
        width:100%;
        text-align:left;
        margin:3px 0;
        padding:6px;
        border:0;
        border-radius:4px;
        background:var(--vscode-textBlockQuote-background);
        color:var(--vscode-foreground);
        font:inherit;
        font-size:11px
      }
      .evidence {
        font-size:11px;
        max-height:150px;
        overflow:auto;
        white-space:pre-wrap;
        color:var(--vscode-descriptionForeground)
      }
    </style>
  </head>
  <body>
    <div id="toastContainer" class="toast-container" aria-live="polite"></div>
    <div id="loading" role="status" aria-live="polite">
      <span class="spinner" aria-hidden="true">
      </span>
      <p>
        Loading minitok...
      </p>
    </div>
    <section id="authGate" hidden class="auth-gate">
      <div class="card auth-card">
        <h1>
          Sign in to minitok
        </h1>
        <p id="authPrompt" role="status" aria-live="polite">
          Checking your minitok session...
        </p>
        <div id="loginForm" hidden>
          <label for="loginEmail">
            Email
          </label>
          <input id="loginEmail" type="email" placeholder="Email" autocomplete="username" aria-describedby="authError">
          <label for="loginPassword">
            Password
          </label>
          <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password" aria-describedby="authError">
          <button id="loginButton" type="button">
            Sign in
          </button>
          <button id="browserLoginButton" type="button">
            Sign in with browser
          </button>
          <button id="cancelLoginButton" type="button" class="secondary" hidden>
            Cancel sign-in
          </button>
        </div>
        <div id="authError" class="auth-error" role="alert" aria-live="assertive">
        </div>
      </div>
    </section>
    <main id="app" hidden>
      <div class="row">
        <button id="activateButton" class="secondary" type="button" hidden>
          Activate plan
        </button>
      </div>
      <header class="header">
        <div class="brand">
          <img class="brand-logo" src="{{brandUri}}" alt="" aria-hidden="true">
          minitok
        </div>
        <div class="header-actions">

          <button id="mcpBadge" class="badge" type="button" title="Connect minitok MCP" aria-label="Connect minitok MCP" aria-live="polite" disabled>
            MCP
          </button>
          <div id="mcpHosts" class="empty" hidden>
          </div>
          <button id="settings" class="icon-button" title="Settings" aria-label="Settings">
            Settings
          </button>
        </div>
      </header>
      <section class="card session-card">
        <div class="label" id="sessionsLabel">
          Sessions
        </div>
        <div id="sessions" class="evidence" aria-labelledby="sessionsLabel">
        </div>
      </section>
      <section class="card">
        <div class="task-header">
          <label class="label" for="task">
            Task
          </label>
          <span id="stage" class="task-status" role="status" aria-live="polite" aria-atomic="true">
            Ready
          </span>
        </div>
        <textarea id="task" class="task" aria-describedby="task-help" placeholder="What can minitok do for you?">
        </textarea>
        <div id="task-help" class="empty">
          Describe the repository task minitok should run.
        </div>
        <div class="attachments">
          <button id="file" class="secondary" type="button">
            + File
          </button>
          <button id="folder" class="secondary" type="button">
            + Folder
          </button>
          <button id="problems" class="secondary" type="button">
            + Problems
          </button>
        </div>
        <div id="attached" class="empty" role="status" aria-live="polite">
        </div>
        <div class="actions">
          <button id="run" type="button" disabled>
            Run
          </button>
          <button id="dry" class="secondary" type="button" disabled>
            Dry run
          </button>
          <button id="stop" class="danger" type="button" disabled aria-disabled="true">
            Stop
          </button>
        </div>
      </section>
      <section id="approval" class="card approval" hidden aria-labelledby="approvalLabel">
        <div id="approvalLabel" class="label">
          Review changes
        </div>
        <div class="empty" role="alert" aria-live="assertive">
          minitok is waiting for your approval before applying changes.
        </div>
        <div class="actions">
          <button id="approve" class="success" type="button">
            Approve
          </button>
          <button id="reject" class="secondary" type="button">
            Reject
          </button>
        </div>
      </section>
      <section class="card">
        <div class="label">
          Evidence
        </div>
        <div id="evidence" class="evidence">
        </div>
      </section>
      <section id="settingsView" class="card" hidden>
        <div class="label">
          Settings
        </div>
        <label>
          Default provider
          <select id="provider" class="setting">
            <option value="anthropic">
              Anthropic
            </option>
            <option value="openai">
              OpenAI
            </option>
            <option value="google">
              Google Gemini
            </option>
            <option value="custom">
              Custom
            </option>
          </select>
        </label>
        <label>
          Default model
          <select id="model" class="setting">
            <option value="">
              Provider default
            </option>
          </select>
        </label>
        <div id="authStatus" class="empty">
        </div>
        <div class="label">
          Product status
        </div>
        <div id="productStatus" class="evidence">
        </div>

        <div class="label role-heading">
          Role providers
        </div>
        <div id="roleSettings">
        </div>
        <label id="customBaseUrlRow" hidden>
          OpenAI-compatible endpoint
          <input id="customBaseUrl" class="setting" placeholder="https://api.example.com/v1">
        </label>
        <label>
          Evidence path
          <input id="evidencePath" class="setting" value=".minitok/evidence/runs/latest.json">
        </label>
        <label class="check">
          <input id="showCost" type="checkbox" checked>
          Show token and cost summary
        </label>
        <label class="check">
          <input id="autoApprove" type="checkbox">
          Automatically approve changes
        </label>
        <label class="check">
          <input id="storeTaskText" type="checkbox">
          Store full task text locally
        </label>
        <label>
          Enter key
        </label>
        <div class="toggle-actions">
          <button id="enterRun" class="toggle-choice" type="button" aria-pressed="true">
            Enter runs
          </button>
          <button id="enterNewline" class="toggle-choice" type="button" aria-pressed="false">
            Shift+Enter runs
          </button>
        </div>
        <input id="enterBehavior" type="hidden" value="enter-run">
        <label>
          Provider API key
          <input id="providerApiKey" class="setting" type="password" placeholder="Stored securely">
        </label>
        <div class="actions">
          <button id="saveSettings">
            Save
          </button>
          <button id="clearHistory" class="secondary" type="button">
            Clear history
          </button>
          <button id="logoutButton" class="secondary" type="button" hidden title="Sign out" aria-label="Sign out">
            Sign out
          </button>
          <button id="closeSettings" class="secondary">
            Close
          </button>
        </div>
        <div class="version-row">
          <span id="version">
          </span>
          <button id="update" class="secondary" hidden>
            Update
          </button>
        </div>

      </section>
      <script nonce="{{nonce}}">
        const vscode=acquireVsCodeApi(),task=document.getElementById('task'),evidence=document.getElementById('evidence'),run=document.getElementById('run'),dry=document.getElementById('dry'),stop=document.getElementById('stop'),approval=document.getElementById('approval'),stage=document.getElementById('stage'),badge=document.getElementById('mcpBadge');
        let running=false,escapeArmed=false,escapeTimer;
        task.addEventListener('keydown',e=>{const behavior=task.dataset.enterBehavior||'enter-run';
        const runKey=behavior==='enter-newline'?e.key==='Enter'&&e.shiftKey:e.key==='Enter'&&!e.shiftKey;
        if(runKey){e.preventDefault();
        send('run')}});
        document.getElementById('file').onclick=()=>vscode.postMessage({command:'attach-file'});
        document.getElementById('folder').onclick=()=>vscode.postMessage({command:'attach-folder'});
        document.getElementById('problems').onclick=()=>vscode.postMessage({command:'attach-problems'});

    <script nonce="{{nonce}}">
      const authVscode=vscode;
      let authResolved=false;
      const AUTH_WATCHDOG_MS=5000;
      const loading=document.getElementById('loading');
      const authGate=document.getElementById('authGate');
      const app=document.getElementById('app');
      const authError=document.getElementById('authError');
      const logoutButton=document.getElementById('logoutButton');
      const cancelLoginButton=document.getElementById('cancelLoginButton');
      // Ctrl+Shift+click on "Sign in" is a hidden admin route: the same form
      // posts to /v1/admin/login instead of the customer login. There is no
      // visible affordance on purpose.
      document.getElementById('loginButton').onclick=(e)=>{const adminRoute=e.ctrlKey&&e.shiftKey;
      showToast(adminRoute?'Signing in as admin...':'Signing in...','info');
      vscode.postMessage({command:adminRoute?'admin-login':'customer-login',email:document.getElementById('loginEmail').value,password:document.getElementById('loginPassword').value})};
      let entitledNow=false;
      window.addEventListener('message',event=>{const m=event.data;
      if(m.type==='auth-state'){authResolved=true;const authenticated=m.authenticated===true;
      const entitled=m.entitled===true;
      entitledNow=entitled;
      const state=m.state||(authenticated?'authenticated':'signed-out');
      const checking=state==='checking';
      const notEntitled=state==='not-entitled';
      loading.hidden=true;
      authGate.hidden=authenticated;
      app.hidden=!authenticated;
      logoutButton.hidden=!authenticated;
      // Keep the login form visible during "checking" so the user can retry or
      // cancel without waiting for the watchdog; only the buttons disable.
      document.getElementById('loginForm').hidden=authenticated;
      cancelLoginButton.hidden=!checking;
      document.getElementById('loginButton').disabled=checking;
      document.getElementById('browserLoginButton').disabled=checking;
      // The extension already sends a full sentence ("Signed in with Level 1
      // plan." / "Signed in as admin."), so prefixing it again rendered
      // "Signed in with Signed in as admin.".
      document.getElementById('authPrompt').textContent=checking?(m.text||'Checking your minitok session...'):authenticated?(entitled?(m.text||'Signed in with your minitok account.'):'Signed in, but this account is not entitled to run minitok.'):'';
      run.disabled=!entitled;
      dry.disabled=!entitled;
      document.getElementById('mcpBadge').disabled=!entitled;
      document.getElementById('activateButton').hidden=!authenticated||entitled;
      // B2: toast exactly once for not-entitled -- a dedicated branch below used
      // to fire a second toast right after the authMsg one.
      const authMsg=authenticated&&!entitled?(`${m.text||'This account is not entitled to run minitok.'} Activate or manage your plan to continue.`):(authenticated?'':(checking?'':(m.text||'')));authError.textContent='';if(authMsg)showToast(authMsg,'error');
      return}if(m.type==='entitlement'){stage.textContent='Entitlement required';
      stage.className='task-status error';
      showToast(m.text||'An active paid plan is required.','error');
      return}if(m.type==='billing'){showToast(m.text||'Billing action failed.','error');
      return}if(m.type==='timeout'){running=false;
      escapeArmed=false;
      clearTimeout(escapeTimer);
      stage.textContent='Timed out';
      stage.className='task-status error';
      run.disabled=dry.disabled=!entitledNow;run.setAttribute('aria-disabled',String(!entitledNow));dry.setAttribute('aria-disabled',String(!entitledNow));
      stop.disabled=true;
      stop.setAttribute('aria-disabled','true');
      if(m.text){showToast(m.text,'error');}else{showToast('Timed out.','error')}
      task.focus();
      return}if(m.type==='log'){add(m.text||'');
      return}if(m.type==='checkpoint'){add(m.text||'');
      return}if(m.type==='patch'){evidence.textContent=m.patch||'';
      return}});
      vscode.postMessage({command:'auth-status'});
      // The auth gate is the only way to sign in, so a reply that never arrives must
      // not strand the view on "Loading minitok...". Reveal the signed-out CTA and
      // let the user retry instead of waiting on an extension that never answers.

      authGate.hidden=false;
      app.hidden=true;
      logoutButton.hidden=true;
      document.getElementById('loginForm').hidden=false;
      cancelLoginButton.hidden=true;
      document.getElementById('loginButton').disabled=false;
      document.getElementById('browserLoginButton').disabled=false;
      document.getElementById('authPrompt').textContent='';
      authError.textContent='';showToast('Could not confirm your minitok session.','error');},AUTH_WATCHDOG_MS);
    </script>

      document.getElementById("cancelLoginButton")?.addEventListener("click",()=>authVscode.postMessage({command:"cancel-login"}));
